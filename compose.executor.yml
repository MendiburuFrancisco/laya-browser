services:
  executor:
    build:
      context: .
      dockerfile: docker/executor/Dockerfile
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "127.0.0.1:${EXECUTOR_PORT:-8787}:8787"
    environment:
      EXECUTOR_API_TOKEN: ${EXECUTOR_API_TOKEN:?Set EXECUTOR_API_TOKEN in your environment}
      EXECUTOR_HOST: 0.0.0.0
      EXECUTOR_PORT: 8787
      EXECUTOR_DATA_DIR: /data/executor
      EXECUTOR_MAX_QUEUED: ${EXECUTOR_MAX_QUEUED:-10}
      EXECUTOR_RUN_TIMEOUT_MS: ${EXECUTOR_RUN_TIMEOUT_MS:-120000}
      EXECUTOR_SHUTDOWN_GRACE_MS: ${EXECUTOR_SHUTDOWN_GRACE_MS:-10000}
      EXECUTOR_MAX_BODY_BYTES: ${EXECUTOR_MAX_BODY_BYTES:-16384}
      EXECUTOR_MAX_LOG_BYTES: ${EXECUTOR_MAX_LOG_BYTES:-5242880}
      EXECUTOR_MAX_ARTIFACT_BYTES: ${EXECUTOR_MAX_ARTIFACT_BYTES:-52428800}
      EXECUTOR_RETENTION_HOURS: ${EXECUTOR_RETENTION_HOURS:-24}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - executor-data:/data/executor
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/node/.cache:size=128m,mode=0755,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 512mb
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  executor-data:
